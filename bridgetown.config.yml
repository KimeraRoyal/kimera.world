url: "https://kimera.world"

permalink: pretty
template_engine: erb

timezone: Europe/London

pagination:
  enabled: true

collections:
  posts:
    output: true
    permalink: pretty
  projects:
    output: true
    permalink: simple
  played:
    output: true
    permalink: pretty

feed:
  collections:
    posts:
      path: "/posts/feed.xml"
    projects:
      path: "/projects/feed.xml"
    played:
      path: "/played/feed.xml"